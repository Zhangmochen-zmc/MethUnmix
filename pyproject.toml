[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methunmix"
version = "2.0.0rc1"
description = "Offline DNA methylation deconvolution workflow"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
authors = [{name = "MethUnmix contributors"}]
dependencies = []
keywords = ["DNA methylation", "deconvolution", "Nextflow", "WGBS", "450K", "EPIC"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
methunmix = "demethflow_core.cli:main"
demethflow = "demethflow_core.legacy:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
  "methunmix_assets.deconvolution.wgbs_vendor*",
  "methunmix_assets.deconvolution.vendor.prmeth_R*",
]

[tool.setuptools.package-data]
methunmix_assets = [
  "VERSION",
  "ASSET_BOUNDARY.txt",
  "capabilities/*.json",
  "assets/**/*.json",
  "deconvolution/*.nf",
  "deconvolution/*.config",
  "deconvolution/array_pro/*.py",
  "deconvolution/bin/*.py",
  "deconvolution/bin/*.R",
  "deconvolution/wgbs_scripts/*.py",
  "deconvolution/wgbs_scripts/*.sh",
  "deconvolution/wgbs_scripts/uxm",
  "nextflow_ref/**/*.nf",
  "nextflow_ref/**/*.config",
  "nextflow_ref/**/*.py",
  "nextflow_ref/**/*.sh",
  "nextflow_ref/**/*.txt",
  "nextflow_ref/**/*.yml",
  "nextflow_ref/**/*.yaml",
  "nextflow_ref/**/*.json",
  "nextflow_ref/README.md",
]

[tool.setuptools.exclude-package-data]
methunmix_assets = [
  "deconvolution/wgbs_vendor/**",
  "deconvolution/vendor/prmeth_R/**",
]
